name: 🎬 Har 4 Ghante - 1 Video Upload

on:
  schedule:
    # Har 4 ghante: 1:30, 5:30, 9:30, 13:30, 17:30, 21:30 UTC
    # = 7:00, 11:00, 15:00, 19:00, 23:00, 3:00 IST
    - cron: '30 1,5,9,13,17,21 * * *'
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'Kitne videos banane hain?'
        required: false
        default: '1'
        type: string
      dry_run:
        description: 'Dry run (YouTube upload skip karo)'
        required: false
        default: 'false'
        type: boolean

jobs:
  generate-videos:
    name: Generate & Upload Math Videos
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install System Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            libcairo2-dev \
            libpango1.0-dev \
            libgdk-pixbuf2.0-dev \
            python3-gi \
            texlive-latex-extra \
            texlive-fonts-extra \
            dvipng \
            fonts-noto \
            fonts-noto-cjk \
            cm-super
          echo "System deps installed"

      - name: 📦 Install Python Dependencies
        run: |
          pip install --upgrade pip wheel
          pip install manim==0.18.1
          pip install -r requirements.txt
          echo "Python deps installed"

      - name: 📁 Create Directories
        run: |
          mkdir -p data/books temp_frames temp_audio temp_media outputs
          echo "Directories ready"

      - name: 🔑 Write YouTube Credentials
        run: |
          if [ -n "${{ secrets.TOKEN_JSON }}" ]; then
            echo '${{ secrets.TOKEN_JSON }}' > token.json
            echo "token.json written"
          else
            echo "TOKEN_JSON secret not set - upload will be skipped"
          fi
          if [ -n "${{ secrets.CLIENT_SECRETS_JSON }}" ]; then
            echo '${{ secrets.CLIENT_SECRETS_JSON }}' > client_secrets.json
            echo "client_secrets.json written"
          fi

      - name: 🎬 Generate Math Video
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_BASE_URL: ${{ secrets.OPENCODE_BASE_URL }}
          OPENCODE_MODEL_NAME: ${{ secrets.OPENCODE_MODEL_NAME }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          BATCH=${{ github.event.inputs.batch_size || '1' }}
          DRY=${{ github.event.inputs.dry_run || 'false' }}
          if [ "$DRY" = "true" ] || [ -z "${{ secrets.TOKEN_JSON }}" ]; then
            echo "Running in DRY RUN mode (no YouTube upload)"
            python main.py --dry-run --batch $BATCH
          else
            echo "Running FULL mode (with YouTube upload)"
            python main.py --batch $BATCH
          fi

      - name: 📤 Upload Videos as Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: math-videos-${{ github.run_number }}
          path: outputs/*.mp4
          retention-days: 7
          if-no-files-found: warn

      - name: 💾 Save Progress to Repository
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main || true
          git add data/topics_progress.json
          git commit -m "Auto: har 4 ghante - 1 video complete [skip ci]" || echo "Nothing to commit"
          git push origin main || echo "Push failed - continuing"
          echo "Progress saved!"

      - name: 📊 Print Summary
        if: always()
        run: |
          echo "=============================="
          echo "  VIDEO COMPLETE - SUMMARY"
          echo "=============================="
          cat data/topics_progress.json 2>/dev/null || echo "No progress file yet"
          echo ""
          echo "Videos in outputs/:"
          ls -lh outputs/*.mp4 2>/dev/null | tail -10 || echo "No videos found"
