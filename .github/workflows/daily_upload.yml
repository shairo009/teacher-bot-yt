name: Daily Teacher Bot

on:
  schedule:
    # Run daily at 8:00 AM IST (02:30 UTC)
    - cron: '30 2 * * *'
  workflow_dispatch:

jobs:
  teacher-bot:
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto fonts-noto-extra

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Create directories
        run: |
          mkdir -p data/books temp_frames temp_audio outputs

      - name: Write YouTube credentials
        run: |
          if [ -n "${{ secrets.TOKEN_JSON }}" ]; then
            echo "${{ secrets.TOKEN_JSON }}" > token.json
          fi
          if [ -n "${{ secrets.CLIENT_SECRETS_JSON }}" ]; then
            echo "${{ secrets.CLIENT_SECRETS_JSON }}" > client_secrets.json
          fi

      - name: Run Teacher Bot
        run: python main.py

      - name: Commit and push progress
        if: always()
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add token.json data/topics_index.json data/curriculum.json || true
          git commit -m "chore: update token and progress [skip ci]" || true
          git push

      - name: Upload artifacts (if any)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: teacher-bot-logs
          path: |
            *.log
            data/*.json
          retention-days: 7