name: Teacher Bot - Generate Video

on:
  schedule:
    # Once daily at 7:30 PM IST (2:00 PM UTC) — evening peak hour
    - cron: '0 14 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (skip YouTube upload)'
        required: false
        default: 'false'
        type: boolean

jobs:
  generate-video:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rate limit check
        id: rate_check
        run: |
          # Check if a video was generated in the last 20 hours
          if [ -f data/video_history.json ]; then
            LAST_RUN=$(python3 -c "
          import json
          from datetime import datetime, timezone, timedelta
          try:
              with open('data/video_history.json') as f:
                  history = json.load(f)
              if history:
                  last = datetime.fromisoformat(history[-1]['timestamp'])
                  if last.tzinfo is None:
                      last = last.replace(tzinfo=timezone.utc)
                  now = datetime.now(timezone.utc)
                  hours_since = (now - last).total_seconds() / 3600
                  print(f'{hours_since:.1f}')
              else:
                  print('999')
          except:
              print('999')
          ")
            echo "Hours since last video: $LAST_RUN"
            SKIP=$(python3 -c "print('true' if float('$LAST_RUN') < 20.0 else 'false')")
            echo "skip=$SKIP" >> $GITHUB_OUTPUT
            if [ "$SKIP" = "true" ]; then
              echo "Last video was less than 20 hours ago. Skipping."
            fi
          else
            echo "No history file. Running."
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Check daily limit
        if: steps.rate_check.outputs.skip != 'true'
        id: daily_check
        run: |
          # Max 1 video per day — human-like pace
          if [ -f data/video_history.json ]; then
            TODAY_COUNT=$(python3 -c "
          import json
          from datetime import datetime, timezone
          try:
              with open('data/video_history.json') as f:
                  history = json.load(f)
              today = datetime.now(timezone.utc).date()
              count = sum(1 for h in history if datetime.fromisoformat(h['timestamp']).date() == today)
              print(count)
          except:
              print(0)
          ")
            echo "Videos today: $TODAY_COUNT"
            if [ "$TODAY_COUNT" -ge 1 ]; then
              echo "Daily limit (1 video) reached. Skipping."
              echo "skip=true" >> $GITHUB_OUTPUT
            else
              echo "skip=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Python 3.11
        if: steps.rate_check.outputs.skip != 'true' && steps.daily_check.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies
        if: steps.rate_check.outputs.skip != 'true' && steps.daily_check.outputs.skip != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ffmpeg libcairo2-dev libpango1.0-dev \
            libgdk-pixbuf2.0-dev fonts-noto cm-super

      - name: Install Python dependencies
        if: steps.rate_check.outputs.skip != 'true' && steps.daily_check.outputs.skip != 'true'
        run: |
          pip install --upgrade pip wheel
          pip install -r requirements.txt

      - name: Write YouTube credentials
        if: steps.rate_check.outputs.skip != 'true' && steps.daily_check.outputs.skip != 'true'
        env:
          TOKEN_JSON: ${{ secrets.TOKEN_JSON }}
          CLIENT_SECRETS_JSON: ${{ secrets.CLIENT_SECRETS_JSON }}
        run: |
          if [ -n "$TOKEN_JSON" ]; then
            echo "$TOKEN_JSON" > token.json
            echo "$CLIENT_SECRETS_JSON" > client_secrets.json
            echo "YouTube credentials written"
          else
            echo "No YouTube credentials found, skipping"
          fi

      - name: Generate video
        if: steps.rate_check.outputs.skip != 'true' && steps.daily_check.outputs.skip != 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          DRY="${{ github.event.inputs.dry_run || 'false' }}"
          if [ "$DRY" = "true" ] || [ ! -f token.json ]; then
            python main.py --dry-run
          else
            python main.py
          fi

      - name: Upload video artifact
        if: steps.rate_check.outputs.skip != 'true' && steps.daily_check.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.run_number }}
          path: outputs/*.mp4
          retention-days: 7
          if-no-files-found: warn

      - name: Save progress
        if: steps.rate_check.outputs.skip != 'true' && steps.daily_check.outputs.skip != 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          # Only commit tracked progress files (not junk)
          git add data/topics_progress.json data/video_history.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Video #$(jq .total_completed data/topics_progress.json) complete [skip ci]"
          git push
