name: Expert Tech Bot — Generate 2-Min Video

on:
  schedule:
    # Automatic 24/7 Cloud Execution Every 4 Hours (6 Times Daily):
    # Runs at 00:00, 04:00, 08:00, 12:00, 16:00, 20:00 UTC (Even if user PC is OFF!)
    - cron: '0 */4 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (skip YouTube upload)'
        required: false
        default: 'false'
        type: boolean
      force:
        description: 'Force run (skip rate limit check)'
        required: false
        default: 'false'
        type: boolean
      topic_id:
        description: 'Force a specific topic index (optional)'
        required: false
        default: ''
        type: string

jobs:
  generate-video:
    runs-on: ubuntu-latest
    timeout-minutes: 50          # 2-min video takes ~25-35 min to render
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rate limit check (min 3.5h between videos)
        id: rate_check
        run: |
          FORCE="${{ github.event.inputs.force || 'false' }}"
          if [ "$FORCE" = "true" ]; then
            echo "skip=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          if [ -f data/video_history.json ]; then
            HOURS=$(python3 -c "
          import json
          from datetime import datetime, timezone
          try:
              with open('data/video_history.json') as f:
                  history = json.load(f)
              if history:
                  last = datetime.fromisoformat(history[-1]['timestamp'])
                  if last.tzinfo is None:
                      last = last.replace(tzinfo=timezone.utc)
                  print(f'{(datetime.now(timezone.utc) - last).total_seconds() / 3600:.2f}')
              else:
                  print('999')
          except:
              print('999')
          ")
            echo "Hours since last video: $HOURS"
            SKIP=$(python3 -c "print('true' if float('$HOURS') < 3.5 else 'false')")
            echo "skip=$SKIP" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Daily limit check (max 6/day)
        if: steps.rate_check.outputs.skip != 'true'
        id: daily_check
        run: |
          FORCE="${{ github.event.inputs.force || 'false' }}"
          if [ "$FORCE" = "true" ]; then
            echo "skip=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          COUNT=$(python3 -c "
          import json
          from datetime import datetime, timezone
          try:
              with open('data/video_history.json') as f:
                  history = json.load(f)
              today = datetime.now(timezone.utc).date()
              def d(h):
                  try:
                      ts = datetime.fromisoformat(h['timestamp'])
                      if ts.tzinfo is None: ts = ts.replace(tzinfo=timezone.utc)
                      return ts.date()
                  except: return None
              print(sum(1 for h in history if d(h) == today))
          except:
              print(0)
          " 2>/dev/null || echo 0)
          echo "Videos today: $COUNT"
          if [ "$COUNT" -ge 6 ]; then
            echo "Daily limit reached."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Python 3.11
        if: steps.rate_check.outputs.skip != 'true' && steps.daily_check.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies
        if: steps.rate_check.outputs.skip != 'true' && steps.daily_check.outputs.skip != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            fonts-noto \
            fonts-dejavu-core \
            fonts-liberation \
            libgdk-pixbuf2.0-dev

      - name: Install Python dependencies
        if: steps.rate_check.outputs.skip != 'true' && steps.daily_check.outputs.skip != 'true'
        run: |
          pip install --upgrade pip wheel
          pip install -r requirements.txt

      - name: Generate video
        if: steps.rate_check.outputs.skip != 'true' && steps.daily_check.outputs.skip != 'true'
        env:
          OPENAI_API_KEY:       ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY:   ${{ secrets.OPENROUTER_API_KEY }}
          OPENCODE_API_KEY:     ${{ secrets.OPENCODE_API_KEY }}
          TOKEN_JSON:           ${{ secrets.TOKEN_JSON }}
          CLIENT_SECRETS_JSON:  ${{ secrets.CLIENT_SECRETS_JSON }}
        run: |
          DRY="${{ github.event.inputs.dry_run || 'false' }}"
          TOPIC="${{ github.event.inputs.topic_id || '' }}"

          CMD="python main.py"
          [ "$DRY" = "true" ] && CMD="$CMD --dry-run"
          [ -n "$TOPIC" ] && CMD="$CMD --topic-id $TOPIC"
          [ -z "$TOKEN_JSON" ] && CMD="$CMD --dry-run"

          echo "Running: $CMD"
          $CMD

      - name: Upload video artifact
        if: steps.rate_check.outputs.skip != 'true' && steps.daily_check.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: expert-video-${{ github.run_number }}
          path: |
            tmp/**/final.mp4
            tmp/**/thumbnail.jpg
          retention-days: 7
          if-no-files-found: warn

      - name: Save progress to repo
        if: steps.rate_check.outputs.skip != 'true' && steps.daily_check.outputs.skip != 'true'
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/tech_progress.json data/video_history.json
          git diff --cached --quiet && echo "No changes" && exit 0
          NEXT=$(python3 -c "
          import json
          try:
              print(json.load(open('data/tech_progress.json'))['current_id'])
          except:
              print('?')
          ")
          git commit -m "Video #$NEXT complete [skip ci]"
          git pull --rebase origin main
          git push

