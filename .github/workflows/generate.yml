name: Animal Shorts

on:
  schedule:
    # 5 times a day (approx every 4.5 hours) at 17 past the hour to avoid GitHub Actions peak load drops
    - cron: "17 2,7,12,17,21 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Create the video artifact without advancing the animal rotation"
        required: false
        default: false
        type: boolean
      animal_id:
        description: "Optional animal index (0 = Tiger, 1 = Red Panda, …)"
        required: false
        default: ""
        type: string

concurrency:
  group: animal-short-generation
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate-animal-short:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install video dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Generate and upload animal Short
        env:
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          ANIMAL_ID: ${{ inputs.animal_id || '' }}
          TOKEN_JSON: ${{ secrets.TOKEN_JSON }}
          CLIENT_SECRETS_JSON: ${{ secrets.CLIENT_SECRETS_JSON }}
        run: |
          command=(python src/animal_short_generator.py)
          if [ "$DRY_RUN" = "true" ]; then command+=(--dry-run); fi
          if [ -n "$ANIMAL_ID" ]; then command+=(--animal-id "$ANIMAL_ID"); fi
          printf 'Running:'
          printf ' %q' "${command[@]}"
          echo
          "${command[@]}"

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: cyber-reel-${{ github.run_number }}
          path: tmp/*/*.mp4
          retention-days: 2
          if-no-files-found: error

      - name: Save animal rotation
        if: inputs.dry_run != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/animal_progress.json data/animal_history.json data/used_animals.json data/last_uploaded_frame.jpg
          git diff --cached --quiet && exit 0
          next=$(python -c "import json; print(json.load(open('data/animal_progress.json'))['current_id'])")
          git commit -m "Animal Short #${next} complete [skip ci]"
          git push origin HEAD:main
