name: Tech Series Bot - Generate Video

on:
  schedule:
    # Six times daily in IST: 6 AM, 10 AM, 2 PM, 6 PM, 10 PM, 2 AM
    - cron: '30 0 * * *'
    - cron: '30 4 * * *'
    - cron: '30 8 * * *'
    - cron: '30 12 * * *'
    - cron: '30 16 * * *'
    - cron: '30 20 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (skip YouTube upload)'
        required: false
        default: 'false'
        type: boolean
      force:
        description: 'Force run (skip rate limit check)'
        required: false
        default: 'false'
        type: boolean

jobs:
  generate-video:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rate limit check (min 3.5h between videos)
        id: rate_check
        run: |
          if [ -f data/video_history.json ]; then
            LAST_RUN=$(python3 -c "
import json
from datetime import datetime, timezone
try:
    with open('data/video_history.json') as f:
        history = json.load(f)
    if history:
        last = datetime.fromisoformat(history[-1]['timestamp'])
        if last.tzinfo is None:
            last = last.replace(tzinfo=timezone.utc)
        hours = (datetime.now(timezone.utc) - last).total_seconds() / 3600
        print(f'{hours:.1f}')
    else:
        print('999')
except:
    print('999')
")
            echo "Hours since last video: $LAST_RUN"
            FORCE="${{ github.event.inputs.force || 'false' }}"
            if [ "$FORCE" = "true" ]; then
              echo "skip=false" >> $GITHUB_OUTPUT
            else
              SKIP=$(python3 -c "print('true' if float('$LAST_RUN') < 3.5 else 'false')")
              echo "skip=$SKIP" >> $GITHUB_OUTPUT
            fi
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Daily limit check (max 6/day)
        if: steps.rate_check.outputs.skip != 'true'
        id: daily_check
        run: |
          if [ -f data/video_history.json ]; then
            TODAY_COUNT=$(python3 -c "
import json
from datetime import datetime, timezone
try:
    with open('data/video_history.json') as f:
        history = json.load(f)
    today = datetime.now(timezone.utc).date()
    def get_date(h):
        try:
            ts = datetime.fromisoformat(h['timestamp'])
            if ts.tzinfo is None:
                ts = ts.replace(tzinfo=timezone.utc)
            return ts.date()
        except:
            return None
    count = sum(1 for h in history if get_date(h) == today)
    print(count)
except:
    print(0)
")
            echo "Videos today: $TODAY_COUNT"
            FORCE="${{ github.event.inputs.force || 'false' }}"
            if [ "$FORCE" = "true" ]; then
              echo "skip=false" >> $GITHUB_OUTPUT
            elif [ "$TODAY_COUNT" -ge 6 ]; then
              echo "Daily limit reached. Skipping."
              echo "skip=true" >> $GITHUB_OUTPUT
            else
              echo "skip=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Python 3.11
        if: steps.rate_check.outputs.skip != 'true' && steps.daily_check.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies
        if: steps.rate_check.outputs.skip != 'true' && steps.daily_check.outputs.skip != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ffmpeg fonts-noto fonts-dejavu-core \
            libgdk-pixbuf2.0-dev

      - name: Install Python dependencies
        if: steps.rate_check.outputs.skip != 'true' && steps.daily_check.outputs.skip != 'true'
        run: |
          pip install --upgrade pip wheel
          pip install -r requirements.txt

      - name: Write YouTube credentials
        if: steps.rate_check.outputs.skip != 'true' && steps.daily_check.outputs.skip != 'true'
        env:
          TOKEN_JSON: ${{ secrets.TOKEN_JSON }}
          CLIENT_SECRETS_JSON: ${{ secrets.CLIENT_SECRETS_JSON }}
        run: |
          if [ -n "$TOKEN_JSON" ]; then
            echo "$TOKEN_JSON" > token.json
            echo "$CLIENT_SECRETS_JSON" > client_secrets.json
            echo "YouTube credentials written"
          else
            echo "No YouTube credentials — will dry-run"
          fi

      - name: Generate video
        if: steps.rate_check.outputs.skip != 'true' && steps.daily_check.outputs.skip != 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          DRY="${{ github.event.inputs.dry_run || 'false' }}"
          if [ "$DRY" = "true" ] || [ ! -f token.json ]; then
            python main.py --dry-run
          else
            python main.py
          fi

      - name: Upload video artifact
        if: steps.rate_check.outputs.skip != 'true' && steps.daily_check.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tech-video-${{ github.run_number }}
          path: outputs/*.mp4
          retention-days: 7
          if-no-files-found: warn

      - name: Save progress to repo
        if: steps.rate_check.outputs.skip != 'true' && steps.daily_check.outputs.skip != 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/tech_progress.json data/video_history.json
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          NEXT=$(python3 -c "import json; d=json.load(open('data/tech_progress.json')); print(d['current_id'])")
          git commit -m "Video #$NEXT complete [skip ci]"
          git push
