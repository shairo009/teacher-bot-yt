name: Animal Shorts

on:
  schedule:
    # 6 AM, 10 AM, 2 PM, 6 PM, 10 PM and 2 AM India Standard Time.
    - cron: "30 0,4,8,12,16,20 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Create the video artifact without advancing the animal rotation"
        required: false
        default: false
        type: boolean
      animal_id:
        description: "Optional animal index (0 = Tiger, 1 = Red Panda, …)"
        required: false
        default: ""
        type: string

concurrency:
  group: animal-short-generation
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate-animal-short:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install video dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Generate a real animal Short
        env:
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          ANIMAL_ID: ${{ inputs.animal_id || '' }}
        run: |
          command=(python src/animal_short_generator.py)
          if [ "$DRY_RUN" = "true" ]; then command+=(--dry-run); fi
          if [ -n "$ANIMAL_ID" ]; then command+=(--animal-id "$ANIMAL_ID"); fi
          printf 'Running:'
          printf ' %q' "${command[@]}"
          echo
          "${command[@]}"

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: animal-short-${{ github.run_number }}
          path: tmp/animal_*/*.mp4
          retention-days: 2
          if-no-files-found: error

      - name: Save animal rotation
        if: inputs.dry_run != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/animal_progress.json data/animal_history.json
          git diff --cached --quiet && exit 0
          next=$(python -c "import json; print(json.load(open('data/animal_progress.json'))['current_id'])")
          git commit -m "Animal Short #${next} complete [skip ci]"
          git push origin HEAD:main
