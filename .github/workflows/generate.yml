name: Animal Shorts

on:
  schedule:
    # Once daily at 07:47 IST (02:17 UTC), offset from the top of the hour to reduce schedule congestion
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Safe preview: no YouTube upload, credentials or upload-state changes"
        required: false
        default: true
        type: boolean
      animal_id:
        description: "Catalog ID 0-686; examples: 42 Eagle, 306 Seahorse, 339 Jellyfish. History bans still apply."
        required: false
        default: ""
        type: string
      renderer:
        description: "auto uses dedicated or catalog morphology 3D; 3d requires supported metadata"
        required: false
        default: auto
        type: choice
        options:
          - auto
          - 3d
          - 2d
      quality:
        description: "Internal 3D quality; output stays 1080x1920 at 30 FPS"
        required: false
        default: standard
        type: choice
        options:
          - draft
          - standard
          - high
      duration:
        description: "Duration in seconds (greater than 0, maximum 180); try 3 for preview"
        required: false
        default: "25"
        type: string

concurrency:
  group: animal-short-generation
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate-animal-short:
    # Publishing is opt-in; previews require no credentials or repository variable.
    if: ${{ inputs.dry_run || vars.ENABLE_ANIMAL_PUBLISH == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure durable history commits
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install video dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Offline regression tests
        run: python -m unittest discover -s tests -v

      - name: Generate and optionally upload animal Short
        env:
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
          ANIMAL_ID: ${{ inputs.animal_id || '' }}
          RENDERER: ${{ inputs.renderer || 'auto' }}
          QUALITY: ${{ inputs.quality || 'standard' }}
          DURATION: ${{ inputs.duration || '25' }}
          OPENBLAS_NUM_THREADS: "1"
          UNIQUE_HISTORY_GIT: "1"
          TOKEN_JSON: ${{ !inputs.dry_run && secrets.TOKEN_JSON || '' }}
          CLIENT_SECRETS_JSON: ${{ !inputs.dry_run && secrets.CLIENT_SECRETS_JSON || '' }}
        run: |
          command=(python src/animal_short_generator.py --renderer "$RENDERER" --quality "$QUALITY" --duration "$DURATION")
          if [ "$DRY_RUN" = "true" ]; then command+=(--dry-run --no-research); fi
          if [ -n "$ANIMAL_ID" ]; then command+=(--animal-id "$ANIMAL_ID"); fi
          printf 'Running:'
          printf ' %q' "${command[@]}"
          echo
          "${command[@]}"

      - name: Upload video and audit artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: animal-reel-${{ github.run_number }}
          path: |
            tmp/reel_*/*.mp4
            tmp/reel_*/generation_manifest.json
            tmp/reel_*/quality_report.json
            tmp/unique-preview-history/*.json
            tmp/unique-preview-history/*.jsonl
            tmp/unique-preview-history/*.initialized
            data/unique_animal_history.json
            data/unique_animal_history.jsonl
            data/unique_animal_history.initialized
          retention-days: 7
          if-no-files-found: warn

      - name: Save durable history and confirmed upload state
        if: ${{ always() && !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for path in data/animal_progress.json data/animal_history.json data/used_animals.json data/last_uploaded_frame.jpg data/recent_frames/ data/unique_animal_history.json data/unique_animal_history.jsonl data/unique_animal_history.initialized; do
            if [ -e "$path" ]; then git add -- "$path"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "Persist animal generation state [skip ci]"
          fi
          git pull --rebase origin main
          git push origin HEAD:main
