<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Math Mastery - Dynamic Animation</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;800&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    background: #000000;
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    font-family: 'Outfit', sans-serif;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    color: white;
}

.grid {
    position: absolute;
    width: 200%;
    height: 200%;
    background-image: 
        linear-gradient(rgba(0, 242, 255, 0.1) 2px, transparent 2px),
        linear-gradient(90deg, rgba(0, 242, 255, 0.1) 2px, transparent 2px);
    background-size: 100px 100px;
    z-index: 0;
    animation: gridMove 20s linear infinite;
    transform: perspective(1000px) rotateX(60deg);
    top: -50%;
}

@keyframes gridMove {
    from { transform: perspective(1000px) rotateX(60deg) translateY(0); }
    to { transform: perspective(1000px) rotateX(60deg) translateY(100px); }
}

.container {
    position: relative;
    z-index: 1;
    width: 900px;
    height: 1600px;
    display: flex;
    flex-direction: column;
    gap: 80px;
    padding: 60px;
    background: rgba(0, 0, 0, 0.6);
    border: 2px solid rgba(0, 242, 255, 0.3);
    border-radius: 40px;
    box-shadow: 0 0 100px rgba(0, 242, 255, 0.1);
    backdrop-filter: blur(10px);
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 4px solid #ff007f;
    padding-bottom: 30px;
}

.level-badge {
    background: #00f2ff;
    color: black;
    padding: 15px 35px;
    border-radius: 15px;
    font-weight: 800;
    font-size: 32px;
    text-transform: uppercase;
    letter-spacing: 4px;
    box-shadow: 0 0 30px #00f2ff;
}

.topic-title {
    font-size: 40px;
    color: #ffffff;
    font-weight: 800;
    text-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
}

.content {
    display: flex;
    flex-direction: column;
    gap: 60px;
    flex-grow: 1;
}

.line-container {
    display: flex;
    align-items: flex-start;
    gap: 30px;
}

.bullet {
    width: 20px;
    height: 20px;
    background: #ff007f;
    border-radius: 50%;
    margin-top: 25px;
    box-shadow: 0 0 20px #ff007f;
    opacity: 0;
    transform: scale(0);
    transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

.bullet.visible {
    opacity: 1;
    transform: scale(1);
}

.line {
    font-size: 64px;
    font-weight: 700;
    line-height: 1.2;
    color: #00f2ff;
    text-shadow: 0 0 15px rgba(0, 242, 255, 0.4);
    overflow: hidden;
    border-right: 4px solid transparent;
    white-space: nowrap;
    width: 0;
}

.line.typing {
    animation: typing 1.5s steps(30, end) forwards, blink 0.75s step-end infinite;
}

@keyframes typing {
    from { width: 0; }
    to { width: 100%; }
}

@keyframes blink {
    from, to { border-color: transparent; }
    50% { border-color: #ff007f; }
}

.footer {
    position: absolute;
    bottom: 80px;
    width: 100%;
    text-align: center;
    font-size: 28px;
    color: #ff007f;
    font-weight: 700;
    letter-spacing: 8px;
    text-transform: uppercase;
}

.glow-orb {
    position: absolute;
    width: 800px;
    height: 800px;
    background: radial-gradient(circle, rgba(255, 0, 127, 0.1) 0%, transparent 70%);
    top: 20%;
    right: -10%;
    z-index: 0;
    animation: pulse 4s ease-in-out infinite;
}

@keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 0.5; }
    50% { transform: scale(1.2); opacity: 0.8; }
}

</style>
</head>
<body>
    <div class="grid"></div>
    <div class="glow-orb"></div>
    
    <div class="container">
        <div class="header">
            <div class="level-badge" id="levelBadge">BASIC</div>
            <div class="topic-title" id="topicTitle">MATH MASTERY</div>
        </div>
        
        <div class="content" id="mainContent">
            <!-- Lines will be injected here -->
        </div>
    </div>

    <div class="footer">TEACHER BOT YT • SERIES 01</div>

<script>
const lines = {{LINES_JSON | safe}};
const container = document.getElementById('mainContent');

async function startAnimation() {
    document.getElementById('levelBadge').textContent = '{{LEVEL_LABEL}}';
    document.getElementById('topicTitle').textContent = '{{TOPIC_LABEL}}';

    for (let i = 0; i < lines.length; i++) {
        if (!lines[i].trim()) continue;

        const lineWrapper = document.createElement('div');
        lineWrapper.className = 'line-container';
        
        const bullet = document.createElement('div');
        bullet.className = 'bullet';
        
        const lineEl = document.createElement('div');
        lineEl.className = 'line';
        lineEl.textContent = lines[i];
        
        lineWrapper.appendChild(bullet);
        lineWrapper.appendChild(lineEl);
        container.appendChild(lineWrapper);

        // Animate bullet
        await new Promise(r => setTimeout(r, 200));
        bullet.classList.add('visible');
        
        // Start typing
        await new Promise(r => setTimeout(r, 300));
        lineEl.classList.add('typing');
        
        // Wait for typing to finish before next line
        await new Promise(r => setTimeout(r, 2000));
        lineEl.style.borderRight = 'none'; // Stop blinking
    }
}

window.onload = startAnimation;
</script>
</body>
</html>
