<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NCERT Lesson - Teacher Bot</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    font-family: 'Outfit', 'Noto Sans Devanagari', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 100px;
}

.card {
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(10px);
    width: 940px;
    border-radius: 40px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.1);
    padding: 60px;
    display: flex;
    flex-direction: column;
    gap: 40px;
    animation: slideUp 1s cubic-bezier(0.23, 1, 0.32, 1);
}

@keyframes slideUp {
    from { opacity: 0; transform: translateY(100px); }
    to { opacity: 1; transform: translateY(0); }
}

.badge-container {
    display: flex;
    justify-content: space-between;
    width: 100%;
}

.badge {
    background: #4A90E2;
    color: white;
    padding: 12px 30px;
    border-radius: 50px;
    font-size: 24px;
    font-weight: 700;
}

.chapter {
    color: #7f8c8d;
    font-size: 22px;
    font-weight: 500;
}

.book-image-container {
    width: 100%;
    height: 600px;
    background: #fff;
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    border: 4px solid #eee;
    animation: fadeIn 1.5s ease;
}

.book-image {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
}

.content {
    display: flex;
    flex-direction: column;
    gap: 30px;
}

.line {
    font-size: 48px;
    line-height: 1.4;
    color: #2c3e50;
    font-weight: 600;
    opacity: 0;
    transform: translateX(-30px);
    transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

.line.visible {
    opacity: 1;
    transform: translateX(0);
}

.teacher-bot {
    position: fixed;
    bottom: 50px;
    right: 80px;
    width: 350px;
    animation: float 3s ease-in-out infinite;
}

@keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-20px); }
}

@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

</style>
</head>
<body>
    <div class="card">
        <div class="badge-container">
            <div class="badge" id="classBadge">Class 1</div>
            <div class="chapter" id="chapterLabel">Maths</div>
        </div>
        
        <!-- Book Image -->
        <div class="book-image-container" id="imageContainer" style="display: none;">
            <img src="" id="bookImage" class="book-image">
        </div>

        <div class="content" id="topicText">
            <!-- Lines will be injected here -->
        </div>
    </div>

    <!-- Teacher Bot Mascot (Placeholder/Emoji for now, could be image) -->
    <div class="teacher-bot">
        <span style="font-size: 200px;">👩‍🏫</span>
    </div>

<script>
const lines = {{LINES_JSON | safe}};
const imageUrl = "{{IMAGE_URL}}";
const container = document.getElementById('topicText');

function animateLesson() {
    // Show image if available
    if (imageUrl && imageUrl !== "None") {
        document.getElementById('imageContainer').style.display = 'flex';
        document.getElementById('bookImage').src = imageUrl;
    }

    let delay = 500;
    lines.forEach((line, idx) => {
        setTimeout(() => {
            const lineEl = document.createElement('div');
            lineEl.className = 'line';
            lineEl.textContent = "• " + line;
            container.appendChild(lineEl);
            
            setTimeout(() => lineEl.classList.add('visible'), 50);
        }, delay);
        delay += 2500; // Line every 2.5 seconds
    });
}

// Initialize
document.getElementById('classBadge').textContent = '{{CLASS_LABEL}}';
document.getElementById('chapterLabel').textContent = '{{CHAPTER_LABEL}}';

// Start animation when page loads
window.onload = animateLesson;
</script>
</body>
</html>
